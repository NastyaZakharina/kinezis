name: Live site smoke test

on:
  schedule:
    - cron: '0 5 * * *'   # daily, ~07:00-08:00 Kyiv
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static checks
        run: node scripts/check-site.js
      - name: Live checks (GET only, never submits forms)
        run: node scripts/live-smoke.js

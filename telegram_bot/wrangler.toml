name = "kinezis-bot"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
# Публічні змінні (не секрети)
SITE = "https://kinezis.com.ua"

# Секрети додаються через команду:
# npx wrangler secret put BOT_TOKEN
# npx wrangler secret put MANAGER_IDS
# npx wrangler secret put MANAGER_PASSWORD

[[kv_namespaces]]
# Після створення KV через dashboard — вставити id сюди:
# npx wrangler kv:namespace create "KINEZIS_KV"
binding = "KV"
id = "ЗАМІНИТИ_НА_РЕАЛЬНИЙ_KV_ID"
